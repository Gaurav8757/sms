<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page Not Found | ASL SMS">
  <title>404 | ASL SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Standardized Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .card-404 {
      width: 100%; max-width: 460px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      position: relative; z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--brand), var(--brand-light));
      -webkit-background-clip: text;
      -moz-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .error-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 12px 32px;
      background: var(--brand);
      color: #fff; font-size: 0.95rem; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
      transition: all 0.2s;
    }

    .btn-home:hover {
      background: var(--brand-dark);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }
  </style>
</head>
<body class="auth-body">
  <div class="bg-decor"></div>
  <div class="bg-grid"></div>

  <div class="card-404">
    <div class="error-code">404</div>
    <h1 class="error-title">Oops! You're lost</h1>
    <p class="error-desc">The page you are looking for does not exist or has been moved. Use the button below to head back to safety.</p>
    <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i>Return Home</a>
  </div>

  <!-- Core Utilities -->
  <script src="assets/js/index.js"></script>
</body>
</html>
