<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Change Password | ASL SMS">
  <title>Change Password | ASL SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Standardized Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
  <div class="bg-decor"></div>
  <div class="bg-grid"></div>

  <div class="change-card">
    <div class="logo-wrap">
      <img class="logo-img" src="assets/img/logo/logo.png" alt="ASL SMS Logo">
    </div>

    <h1 class="card-title">Set new password <i class="fa-solid fa-key" style="color: var(--brand); margin-left: 4px; font-size: 1.15rem;"></i></h1>
    <p class="card-desc">Enter your new password below and confirm it to access your portal securely.</p>

    <div class="error-msg" id="errorBox">
      <i class="fa-solid fa-circle-exclamation"></i> <span id="errorText">Passwords do not match.</span>
    </div>

    <form id="changeForm">
      <div class="form-group">
        <label for="new-password">New password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="new-password" placeholder="Enter new password" required>
          <button type="button" class="eye-btn" onclick="togglePasswordVisibility('new-password', 'eye1')">
            <i class="fa-regular fa-eye" id="eye1"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm new password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="confirm-password" placeholder="Confirm new password" required>
          <button type="button" class="eye-btn" onclick="togglePasswordVisibility('confirm-password', 'eye2')">
            <i class="fa-regular fa-eye" id="eye2"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Set new password</button>
    </form>

    <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left-long"></i>Back to Login</a>
  </div>

  <!-- Core Utilities -->
  <script src="assets/js/index.js"></script>
  <script>
    document.getElementById('changeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');

      errorBox.style.display = 'none';

      if (p1.length < 6) {
        errorText.textContent = "Password must be at least 6 characters long.";
        errorBox.style.display = 'block';
        return;
      }

      if (p1 !== p2) {
        errorText.textContent = "Passwords do not match.";
        errorBox.style.display = 'block';
        return;
      }

      // Success redirect to password-changed.html
      window.location.href = 'password-changed.html';
    });
  </script>
</body>
</html>
