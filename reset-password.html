<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset Password | ASL SMS">
  <title>Reset Password | ASL SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Standardized Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
  <div class="bg-decor"></div>
  <div class="bg-grid"></div>

  <div class="reset-card">
    <div class="logo-wrap">
      <img class="logo-img" src="assets/img/logo/logo.png" alt="ASL SMS Logo">
    </div>

    <h1 class="card-title">Reset password <i class="fa-solid fa-lock" style="color: var(--brand); margin-left: 4px; font-size: 1.15rem;"></i></h1>
    <p class="card-desc">Enter your email address and we'll send you instructions on how to reset your password.</p>

    <div class="success-alert" id="successBox">
      <i class="fa-solid fa-circle-check"></i> <strong>Instructions sent!</strong><br>
      We sent reset instructions to <span id="targetEmail" style="font-weight: 700;"></span>. Please check your inbox.
    </div>

    <form id="resetForm">
      <div class="form-group" id="inputGroup">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="email" placeholder="Enter registered email" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send reset instructions</button>
    </form>

    <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left-long"></i>Back to Login</a>
  </div>

  <!-- Core Utilities -->
  <script src="assets/js/index.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      document.getElementById('targetEmail').textContent = email;
      document.getElementById('successBox').style.display = 'block';
      document.getElementById('inputGroup').style.display = 'none';
      document.getElementById('submitBtn').style.display = 'none';
    });
  </script>
</body>
</html>
